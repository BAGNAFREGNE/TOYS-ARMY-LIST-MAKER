name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install flet

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'

    - name: DEBUG - Controllo File
      run: |
        echo "=== STAMPO IL CONTENUTO DELLA CARTELLA ==="
        ls -R
        echo "=========================================="

    - name: Build APK
      run: |
        yes | flet build apk --module-name main --verbose

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ToysArmy-App
        path: "**/*.apk"
